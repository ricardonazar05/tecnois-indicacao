<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste — Sistema de Indicação TecNois</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#16232F;}
  h1{font-size:20px;}
  .box{background:#F7FAFD;border:1px solid #DDE6EF;border-radius:12px;padding:20px;margin:16px 0;}
  input{width:100%;padding:10px;border:1px solid #DDE6EF;border-radius:8px;margin-bottom:10px;}
  button{background:#FA770B;color:#fff;border:none;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;}
  #linkBox{word-break:break-all;font-family:monospace;background:#fff;padding:10px;border-radius:8px;}
  #statusMsg{font-size:13px;color:#6B7A8D;margin-top:10px;}
</style>
</head>
<body>

<h1>🔗 Teste do sistema de indicação</h1>

<div class="box" id="etapaGerar">
  <p>Simulando "terminei o quiz" — gera seu código único:</p>
  <input type="text" id="nomeInput" placeholder="Seu nome (opcional)">
  <button onclick="gerarMeuLink()">Gerar meu link de indicação</button>
</div>

<div class="box hidden" id="etapaLink" style="display:none;">
  <p>Seu link único:</p>
  <div id="linkBox"></div>
  <p style="margin-top:16px;">Indicações confirmadas: <strong id="contador">0</strong></p>
  <button onclick="atualizarContador()">🔄 Atualizar contador</button>
</div>

<div id="statusMsg"></div>

<script>
// pega ou cria um "fingerprint" simples pra esse visitante (evita contar a mesma pessoa 2x)
function getFingerprint(){
  let fp = localStorage.getItem('tecnois_fp');
  if(!fp){
    fp = 'fp_' + Math.random().toString(36).substring(2) + Date.now();
    localStorage.setItem('tecnois_fp', fp);
  }
  return fp;
}

async function gerarMeuLink(){
  const nome = document.getElementById('nomeInput').value;
  document.getElementById('statusMsg').textContent = 'Gerando...';
  try{
    const resp = await fetch('/api/criar-participante', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nome, perfilQuiz:'teste' })
    });
    const data = await resp.json();
    if(data.refCode){
      const link = window.location.origin + '/?ref=' + data.refCode;
      document.getElementById('linkBox').textContent = link;
      document.getElementById('etapaLink').style.display = 'block';
      document.getElementById('etapaGerar').style.display = 'none';
      localStorage.setItem('meu_ref_code', data.refCode);
      document.getElementById('statusMsg').textContent = '';
    } else {
      document.getElementById('statusMsg').textContent = 'Erro: ' + (data.erro || 'desconhecido');
    }
  }catch(e){
    document.getElementById('statusMsg').textContent = 'Erro de conexão: ' + e.message;
  }
}

async function atualizarContador(){
  const refCode = localStorage.getItem('meu_ref_code');
  if(!refCode) return;
  const resp = await fetch('/api/stats?refCode=' + refCode);
  const data = await resp.json();
  document.getElementById('contador').textContent = data.totalIndicacoes ?? 0;
}

// se alguém chegou através de um link (?ref=CODIGO), registra a visita
async function registrarChegadaPorIndicacao(){
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  if(!ref) return;

  await fetch('/api/track', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ refCode: ref, visitorFingerprint: getFingerprint() })
  });
}

registrarChegadaPorIndicacao();

// se já gerou link antes, mostra ele de novo
const jaTemCodigo = localStorage.getItem('meu_ref_code');
if(jaTemCodigo){
  document.getElementById('linkBox').textContent = window.location.origin + '/?ref=' + jaTemCodigo;
  document.getElementById('etapaLink').style.display = 'block';
  document.getElementById('etapaGerar').style.display = 'none';
  atualizarContador();
}
</script>

</body>
</html>
