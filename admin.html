<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Programa de Indicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0787F0; --orange:#FA770B; --slate-950:#16232F; --slate-700:#3A4F63; --slate-600:#6B7A8D;
    --surface-50:#F7FAFD; --surface-100:#EEF3F8; --surface-200:#DDE6EF; --green:#1F9D6B;
    --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--surface-50);color:var(--slate-950);font-family:var(--font-body);}

  .login-wrap{max-width:360px;margin:80px auto;padding:0 20px;}
  .login-card{background:#fff;border:1px solid var(--surface-200);border-radius:16px;padding:30px;box-shadow:0 8px 24px rgba(22,35,47,0.08);}
  .login-card h1{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0 0 6px;}
  .login-card p{font-size:13px;color:var(--slate-600);margin:0 0 18px;}
  input[type=password]{width:100%;border:1.5px solid var(--surface-200);border-radius:8px;padding:12px 14px;font-size:14px;}
  .btn{width:100%;margin-top:14px;background:var(--orange);color:#fff;border:none;border-radius:999px;
    font-weight:700;font-size:14px;padding:13px 18px;cursor:pointer;}
  .erro-msg{color:#DD4B39;font-size:12.5px;margin-top:8px;}

  .app{display:none;}
  .app.ativo{display:block;}

  .admin-nav{background:var(--slate-950);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .admin-nav-brand{font-family:var(--font-display);font-weight:800;color:#fff;font-size:15px;}
  .admin-nav-links{display:flex;gap:8px;}
  .admin-nav-link{font-family:var(--font-mono);font-size:12px;font-weight:600;color:rgba(247,250,253,0.7);text-decoration:none;
    padding:8px 14px;border-radius:8px;transition:background .15s,color .15s;}
  .admin-nav-link:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .admin-nav-link.ativo{background:var(--orange);color:#fff;}
  .app-content{max-width:1000px;margin:0 auto;padding:30px 18px 60px;}
  .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topo h1{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0;}
  select{border:1.5px solid var(--surface-200);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--font-body);}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:#fff;border:1px solid var(--surface-200);border-radius:12px;padding:16px;text-align:center;}
  .stat-card .num{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--blue);}
  .stat-card .label{font-family:var(--font-mono);font-size:10px;color:var(--slate-600);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  @media(max-width:600px){.stats-row{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--surface-200);}
  th{background:var(--surface-100);text-align:left;padding:12px 14px;font-family:var(--font-mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--slate-700);}
  td{padding:12px 14px;font-size:13.5px;border-top:1px solid var(--surface-100);}
  tr.destaque td{background:rgba(31,157,107,0.06);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .badge.ok{background:rgba(31,157,107,0.15);color:var(--green);}
  .badge.pendente{background:var(--surface-100);color:var(--slate-600);}
  .badge.notificado{background:rgba(7,135,240,0.12);color:var(--blue);}
  .rank{font-family:var(--font-mono);font-weight:700;color:var(--slate-600);}
  .sem-dados{text-align:center;padding:40px 20px;color:var(--slate-600);}

  .table-wrap{overflow-x:auto;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>🔒 Painel do Programa</h1>
    <p>Digite a senha de administrador pra ver o ranking de indicações.</p>
    <input type="password" id="senhaInput" placeholder="Senha">
    <button class="btn" onclick="fazerLogin()">Entrar</button>
    <div class="erro-msg" id="erroMsg"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="admin-nav">
    <div class="admin-nav-brand">⚙️ TecNois Admin</div>
    <div class="admin-nav-links">
      <a href="/admin.html" class="admin-nav-link ativo">📊 Ranking</a>
      <a href="/admin-config.html" class="admin-nav-link">⚙️ Configurar Campanhas</a>
    </div>
  </div>

  <div class="app-content">
  <div class="topo">
    <h1>📊 Ranking de Indicações</h1>
    <select id="filtroCampanha" onchange="carregarDados()">
      <option value="">Todas as campanhas</option>
      <option value="tecnois">TecNois</option>
      <option value="lacoque">Lacoque Mais Cachos</option>
    </select>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="totalParticipantes">0</div><div class="label">Participantes</div></div>
    <div class="stat-card"><div class="num" id="totalIndicacoes">0</div><div class="label">Indicações confirmadas</div></div>
    <div class="stat-card"><div class="num" id="totalGanhadores">0</div><div class="label">Bateram a meta</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nome</th><th>WhatsApp</th><th>Campanha</th><th>Indicações</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>
  </div>
  <div class="sem-dados hidden" id="semDados">Nenhum participante ainda.</div>
  </div>
</div>

<script>
let SENHA = null;

async function fazerLogin(){
  const senha = document.getElementById('senhaInput').value;
  document.getElementById('erroMsg').textContent = '';

  try{
    const resp = await fetch('/api/admin-listar', { headers: { 'x-admin-key': senha } });
    if(resp.status === 401){
      document.getElementById('erroMsg').textContent = 'Senha incorreta.';
      return;
    }
    SENHA = senha;
    sessionStorage.setItem('admin_senha', senha);
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('app').classList.add('ativo');
    carregarDados();
  }catch(e){
    document.getElementById('erroMsg').textContent = 'Erro de conexão: ' + e.message;
  }
}

async function carregarDados(){
  const campanha = document.getElementById('filtroCampanha').value;
  const url = '/api/admin-listar' + (campanha ? '?campanha=' + campanha : '');

  const resp = await fetch(url, { headers: { 'x-admin-key': SENHA } });
  if(!resp.ok){
    alert('Sessão expirada ou senha inválida. Recarregue a página.');
    return;
  }
  const data = await resp.json();
  renderizar(data.participantes || []);
}

function renderizar(lista){
  document.getElementById('totalParticipantes').textContent = lista.length;
  document.getElementById('totalIndicacoes').textContent = lista.reduce((acc, p) => acc + p.totalIndicacoes, 0);
  document.getElementById('totalGanhadores').textContent = lista.filter(p => p.bateuMeta).length;

  const tbody = document.getElementById('tabelaBody');
  tbody.innerHTML = '';

  if(lista.length === 0){
    document.getElementById('semDados').classList.remove('hidden');
    return;
  }
  document.getElementById('semDados').classList.add('hidden');

  lista.forEach((p, idx) => {
    const tr = document.createElement('tr');
    if(p.bateuMeta) tr.className = 'destaque';

    let statusBadge = '<span class="badge pendente">Em andamento</span>';
    if(p.bateuMeta && p.premioNotificado) statusBadge = '<span class="badge notificado">✓ Notificado</span>';
    else if(p.bateuMeta) statusBadge = '<span class="badge ok">🎁 Bateu a meta</span>';

    tr.innerHTML = `
      <td class="rank">${idx + 1}</td>
      <td>${p.nome}</td>
      <td>${p.whatsapp}</td>
      <td>${p.campanhaNome}</td>
      <td><strong>${p.totalIndicacoes}</strong> / ${p.meta}</td>
      <td>${statusBadge}</td>
    `;
    tbody.appendChild(tr);
  });
}

// se já logou antes nessa sessão do navegador, entra direto
const senhaSalva = sessionStorage.getItem('admin_senha');
if(senhaSalva){
  document.getElementById('senhaInput').value = senhaSalva;
  fazerLogin();
}
</script>
</body>
</html>
